<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>智能侧边栏系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/update.css">
</head>
<body>
    <!-- 侧边栏容器 -->
    <div class="sidebar-container">
        <!-- 图标侧边栏 -->
        <div class="sidebar-secondary" id="sidebarSecondary">
            <button class="icon-btn" id="menuBtn" aria-label="打开主菜单" title="打开主菜单">
                <i class="fas fa-bars" aria-hidden="true"></i>
                <span class="sr-only">打开主菜单</span>
            </button>
            <button class="icon-btn" id="newChatBtn" aria-label="新建对话" title="新建对话">
                <i class="fas fa-plus" aria-hidden="true"></i>
                <span class="sr-only">新建对话</span>
            </button>
        </div>

        <!-- 主侧边栏 -->
        <div class="sidebar-primary" id="sidebarPrimary">
            <div class="sidebar-primary-nav">
                <button class="icon-btn" id="assistantBtn" aria-label="助手" title="助手">
                    <i class="fas fa-robot" aria-hidden="true"></i>
                    <span class="sr-only">助手</span>
                </button>
                <button class="icon-btn" id="historyBtn" aria-label="历史对话" title="历史对话">
                    <i class="fas fa-history" aria-hidden="true"></i>
                    <span class="sr-only">历史对话</span>
                </button>
                <button class="icon-btn" id="backBtn" aria-label="返回图标栏" title="返回图标栏">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    <span class="sr-only">返回图标栏</span>
                </button>
            </div>
            <div class="sidebar-primary-content">
                <div class="content-view" id="assistantView">
                    <h3>智能助手</h3>
                    <div class="assistant-message">
                        <!-- Hello! I am your Agent assistant, what can I help you with? -->
                        <p>您好！我是您的智能助手，请问有什么可以帮您？</p>
                    </div>
                    <div class="assistant-actions">
                        <button class="action-btn">常见问题解答</button>
                        <button class="action-btn">使用教程</button>
                        <button class="action-btn">系统设置</button>
                    </div>
                </div>
                
                <div class="content-view" id="historyView">
                    <h3>历史对话记录</h3>
                    <ul class="conversation-list" id="conversationList">
                    <!-- 对话列表将通过JavaScript动态生成 -->
                    </ul>
                    <button class="new-conversation-btn" id="newConversationBtn">+ 新建对话</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 主内容区域 -->
    <div class="main-content" id="mainContent">
        <div class="chat-container">
            <div class="messages-container" id="messagesContainer">
                <div class="debug-placeholder">
                    消息容器已加载，等待初始化...
                </div>
                <!-- 消息将通过JavaScript动态添加 -->
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <textarea placeholder="输入消息..." rows="1" id="messageInput"></textarea>
                <button id="sendButton">发送</button>
            </div>
        </div>
    </div>
    
        <div id="deleteDialog" class="dialog-overlay">
            <div class="dialog-card danger">
                <div class="dialog-header">
                    <h3>删除对话</h3>
                    <button class="dialog-close">&times;</button>
                </div>
                <div class="dialog-body">
                    <i class="dialog-icon fas fa-trash-alt"></i>
                    <p>确定要永久删除这个对话吗？</p>
                    <p class="dialog-warning">此操作不可撤销！</p>
                </div>
                <div class="dialog-footer">
                    <button class="btn btn-cancel">取消</button>
                    <button class="btn btn-confirm">确认删除</button>
                </div>
            </div>
        </div>

        <div id="renameDialog" class="dialog-overlay">
            <div class="dialog-card info">
                <div class="dialog-header">
                    <h3>重命名对话</h3>
                    <button class="dialog-close">&times;</button>
                </div>
                <div class="dialog-body">
                    <i class="dialog-icon fas fa-edit"></i>
                    <input type="text" id="renameInput" 
                        placeholder="输入新标题" 
                        maxlength="50"
                        class="title-input">
                    <!-- 添加这两个元素 -->
                    <span class="error-hint"></span>
                    <span class="char-counter">0/50</span>
                </div>
                <div class="dialog-footer">
                    <button class="btn btn-cancel">取消</button>
                    <button class="btn btn-confirm">确认</button>
                </div>
            </div>
        </div>

    <script>
        // 在init.js之前定义
        window.conversations = []; // 初始为空数组
        window.currentConversationId = null; // 初始为null
    </script>

    <script src="js/sidebar.js"></script>
    <script src="js/init.js"></script>
    <script src="js/historychat.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
